name: CI - Develop PR

on:
  pull_request:
    branches: [develop]
    types: [opened, synchronize, reopened]

env:
  NODE_VERSION: '22'
  TERRAFORM_VERSION: '1.13.0'
  AWS_REGION: 'us-east-2'

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.filter.outputs.app }}
      iac: ${{ steps.filter.outputs.iac }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Check for changes
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36
        id: filter
        with:
          filters: |
            app:
              - 'app/**'
            iac:
              - 'iac/**'

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.app == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Run ESLint
        working-directory: app
        run: npm run lint

  format-check:
    name: Format Check
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.app == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Check Prettier formatting
        working-directory: app
        run: npm run format:check

  terraform-format:
    name: Terraform Format
    runs-on: ubuntu-latest
    needs: [changes, lint, format-check]
    if: needs.changes.outputs.iac == 'true' && (needs.lint.result == 'success' || needs.lint.result == 'skipped') && (needs.format-check.result == 'success' || needs.format-check.result == 'skipped')
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Terraform Format Check
        run: terraform fmt -check -recursive iac/

  terraform-validate:
    name: Terraform Validate
    runs-on: ubuntu-latest
    needs: [changes, terraform-format]
    if: needs.changes.outputs.iac == 'true'
    defaults:
      run:
        working-directory: iac/environments/dev
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Terraform Init
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate -no-color

  terraform-plan:
    name: Terraform Plan (Dev)
    runs-on: ubuntu-latest
    needs: [changes, terraform-validate]
    if: needs.changes.outputs.iac == 'true'
    environment: dev
    defaults:
      run:
        working-directory: iac/environments/dev
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b
        with:
          python-version: '3.12'

      - name: Build Python Lambda Layer
        run: python3 ../../modules/compute/scripts/build_layer.py ../../../app/lambdas/worker-process

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        run: terraform init -backend-config="profile="

      - name: Terraform Plan
        id: plan
        env:
          TF_VAR_environment: ${{ vars.TF_ENVIRONMENT }}
          TF_VAR_domain_name: ${{ vars.TF_DOMAIN_NAME }}
          TF_VAR_ses_sender_email: ${{ vars.TF_SES_SENDER_EMAIL }}
          TF_VAR_origin_verify_header_value: ${{ secrets.ORIGIN_VERIFY_HEADER }}
        run: |
          set -o pipefail
          terraform plan -out=tfplan 2>&1 | tee plan_output.txt

      - name: Upload Terraform plan
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: terraform-plan-dev
          path: iac/environments/dev/tfplan
          retention-days: 7

      - name: Post plan to PR
        if: always()
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea
        with:
          script: |
            const fs = require('fs');
            const outcome = '${{ steps.plan.outcome }}';
            let planOutput = '';
            try {
              planOutput = fs.readFileSync('iac/environments/dev/plan_output.txt', 'utf8');
            } catch (e) {
              planOutput = 'No plan output available';
            }
            const truncated = planOutput.length > 60000 
              ? planOutput.substring(0, 60000) + '\n\n... (truncated)'
              : planOutput;
            
            const status = outcome === 'success' ? '✅' : '❌';
            const body = `## Terraform Plan - Dev ${status}\n\n<details>\n<summary>Show Plan</summary>\n\n\`\`\`hcl\n${truncated}\n\`\`\`\n\n</details>`;
            
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });

      - name: Fail if plan failed
        if: steps.plan.outcome == 'failure'
        run: exit 1
