name: CI - Feature Branches

on:
  push:
    branches:
      - 'feature/**'
      - 'fix/**'
      - 'refactor/**'

env:
  NODE_VERSION: '22'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Run ESLint
        working-directory: app
        run: npm run lint

  build-check:
    name: Build Check
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        lambda:
          - check-expired-raffles
          - close-raffle
          - create-raffle
          - get-raffle
          - image-optimizer
          - ingest-participation
          - list-raffles
          - participation-process
          - post-confirmation
          - upload-image
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install lambda dependencies
        working-directory: app/lambdas/${{ matrix.lambda }}
        run: npm ci --omit=dev

      - name: Create deployment package
        working-directory: app/lambdas/${{ matrix.lambda }}
        run: |
          zip -r ../../../${{ matrix.lambda }}.zip .
          echo "Package size: $(du -h ../../../${{ matrix.lambda }}.zip | cut -f1)"

      - name: Verify package size
        run: |
          SIZE=$(stat -c%s ${{ matrix.lambda }}.zip)
          MAX_SIZE=$((50 * 1024 * 1024))
          if [ $SIZE -gt $MAX_SIZE ]; then
            echo "Package exceeds 50MB limit"
            exit 1
          fi
          echo "Package OK: $(du -h ${{ matrix.lambda }}.zip | cut -f1)"
