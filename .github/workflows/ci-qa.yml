name: CI - QA

on:
  push:
    branches: [qa]

env:
  NODE_VERSION: '22'
  TERRAFORM_VERSION: '1.13.0'
  AWS_REGION: 'us-east-2'

permissions:
  contents: read
  id-token: write

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Run Jest tests
        working-directory: app
        run: npm run test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: coverage-report
          path: app/coverage/
          retention-days: 7

  sonarcloud:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Download coverage report
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: coverage-report
          path: app/coverage/

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@ffc3010689be73b8e5ae0c57ce35968afd7909e8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=jeancdevx_rafflenow-v2
            -Dsonar.organization=jeancdevx
            -Dsonar.sources=app/lambdas
            -Dsonar.tests=app/lambdas
            -Dsonar.test.inclusions=**/__tests__/**
            -Dsonar.exclusions=**/node_modules/**,**/__tests__/**,**/worker-process/**
            -Dsonar.javascript.lcov.reportPaths=app/coverage/lcov.info

  deploy-dev:
    name: Deploy to Dev
    runs-on: ubuntu-latest
    needs: [unit-tests, sonarcloud]
    environment: dev
    defaults:
      run:
        working-directory: iac/environments/dev
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b
        with:
          python-version: '3.12'

      - name: Build Python Lambda Layer
        run: python3 ../../modules/compute/scripts/build_layer.py ../../../app/lambdas/worker-process

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        run: terraform init -backend-config="profile="

      - name: Terraform Apply
        env:
          TF_VAR_environment: ${{ vars.TF_ENVIRONMENT }}
          TF_VAR_domain_name: ${{ vars.TF_DOMAIN_NAME }}
          TF_VAR_ses_sender_email: ${{ vars.TF_SES_SENDER_EMAIL }}
          TF_VAR_origin_verify_header_value: ${{ secrets.ORIGIN_VERIFY_HEADER }}
        run: terraform apply -auto-approve -no-color
