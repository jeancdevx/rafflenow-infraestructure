name: CI - QA

on:
  push:
    branches: [qa]

env:
  NODE_VERSION: '22'
  TERRAFORM_VERSION: '1.13.0'
  AWS_REGION: 'us-east-2'

permissions:
  contents: read
  id-token: write

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Run Jest tests
        working-directory: app
        run: npm run test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: app/coverage/
          retention-days: 7

  sonarcloud:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download coverage report
        uses: actions/download-artifact@v4
        with:
          name: coverage-report
          path: app/coverage/

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=jeancdevx_rafflenow-v2
            -Dsonar.organization=jeancdevx
            -Dsonar.sources=app/lambdas
            -Dsonar.tests=app/lambdas
            -Dsonar.test.inclusions=**/__tests__/**
            -Dsonar.exclusions=**/node_modules/**,**/__tests__/**,**/worker-process/**
            -Dsonar.javascript.lcov.reportPaths=app/coverage/lcov.info

  deploy-dev:
    name: Deploy to Dev
    runs-on: ubuntu-latest
    needs: [unit-tests, sonarcloud]
    environment: dev
    defaults:
      run:
        working-directory: iac/environments/dev
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Apply
        env:
          TF_VAR_environment: ${{ vars.TF_ENVIRONMENT }}
          TF_VAR_domain_name: ${{ vars.TF_DOMAIN_NAME }}
          TF_VAR_ses_sender_email: ${{ vars.TF_SES_SENDER_EMAIL }}
          TF_VAR_origin_verify_header_value: ${{ secrets.ORIGIN_VERIFY_HEADER }}
        run: terraform apply -auto-approve -no-color
