      sortKey: -1762452626778
      description: ""
    children:
      - url: https://cognito-idp.{{ _.region }}.amazonaws.com/
        name: get admin token
        meta:
          id: req_b993e86b384743b0a4430157feac69cc
          created: 1762452268359
          modified: 1762867889787
          isPrivate: false
          description: ""
          sortKey: -1762452560901
        method: POST
        body:
          mimeType: application/json
          text: |-
            {
              "AuthFlow": "USER_PASSWORD_AUTH",
              "ClientId": "{{ _.client_id }}",
              "AuthParameters": {
                "USERNAME": "{{ _.admin_email }}",
                "PASSWORD": "{{ _.admin_password }}"
              }
            }
        headers:
          - name: Content-Type
            value: application/x-amz-json-1.1
          - name: X-Amz-Target
            value: AWSCognitoIdentityProviderService.InitiateAuth
        settings:
          renderRequestBody: true
          encodeUrl: true
          followRedirects: global
          cookies:
            send: true
            store: true
          rebuildPath: true
