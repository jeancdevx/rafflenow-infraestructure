type: collection.insomnia.rest/5.0
schema_version: "5.1"
name: rafflenow
meta:
  id: wrk_8af41df28711465592de50b8a57ba552
  created: 1762465041206
  modified: 1762465041206
  description: |
    RaffleNow API Collection - Arquitectura Dual API Gateway
    
    API Pública (Sin autenticación):
    - GET /api/v1/raffles - Listar sorteos (con paginación y filtros)
    - GET /api/v1/raffles/{id} - Obtener sorteo por ID
    
    API Autenticada (Requiere token Cognito):
    - POST /api/v1/raffles - Crear sorteo (Solo Admin)
    - POST /api/v1/raffles/{id}/participate - Participar en sorteo (Usuario o Admin)
    - POST /api/v1/raffles/{id}/close - Cerrar sorteo (Solo Admin)
    - POST /api/v1/assets/upload - Obtener URL presignada (Solo Admin)
    
    Actualizado: 2025-11-22 - FASE 1 y FASE 2 (list-raffles con Powertools)
